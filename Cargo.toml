[package]
name = "dispersion"
version = "0.1.6"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
log = "0.4"
fern = "0.7"
humantime = "2.2.0"
eyre = "0.6.12"
self_update = { version = "0.44.0", features = [
    "reqwest",
    "signatures",
    "rustls",
    "archive-zip",
    "compression-zip-deflate",
] }
reqwest = { version = "0.13.2", features = ["blocking", "rustls"] }
eframe = { version = "0.34.2", features = ["default"] }
egui_commonmark = "0.23"
tokio = { version = "1", features = ["full"] }
